<!DOCTYPE html>
<html>
<head>
    <title>Syllabus PDFs</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            background:linear-gradient(135deg,#667eea,#764ba2);
            min-height:100vh;
            padding:40px;
        }

        .container{
            max-width:900px;
            margin:auto;
            background:white;
            padding:30px;
            border-radius:20px;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
        }

        h2{
            text-align:center;
            color:#4f46e5;
            margin-bottom:30px;
        }

        .pdf-list{
            list-style:none;
        }

        .pdf-item{
            background:#f4f7ff;
            margin-bottom:15px;
            padding:18px;
            border-radius:12px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            transition:0.3s;
        }

        .pdf-item:hover{
            transform:translateY(-3px);
            box-shadow:0 5px 15px rgba(0,0,0,0.1);
        }

        .pdf-name{
            font-weight:bold;
            color:#333;
        }

        .view-btn{
            background:#10b981;
            color:white;
            text-decoration:none;
            padding:10px 18px;
            border-radius:8px;
            font-weight:bold;
        }

        .view-btn:hover{
            background:#059669;
        }

        .empty{
            text-align:center;
            color:#777;
            font-size:18px;
            padding:30px;
        }

        .back-btn{
            display:block;
            width:220px;
            margin:30px auto 0;
            text-align:center;
            background:#4f46e5;
            color:white;
            text-decoration:none;
            padding:12px;
            border-radius:10px;
            font-weight:bold;
        }

        .back-btn:hover{
            background:#3730a3;
        }

    </style>
</head>

<body>

<div class="container">

    <h2>📚 Uploaded Syllabus PDFs</h2>

    {% if files %}

    <ul class="pdf-list">

        {% for file in files %}

        <li class="pdf-item">

            <span class="pdf-name">
                📄 {{ file }}
            </span>

            <a href="/uploads/{{ file }}"
               target="_blank"
               class="view-btn">
               View PDF
            </a>

        </li>

        {% endfor %}

    </ul>

    {% else %}

        <div class="empty">
            📂 No PDFs Uploaded Yet
        </div>

    {% endif %}

    <a href="/dashboard" class="back-btn">
        ⬅ Back to Dashboard
    </a>

</div>

</body>
</html>
