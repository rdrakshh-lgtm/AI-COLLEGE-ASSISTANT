<!DOCTYPE html>
<html>
<head>
    <title>Attendance Details</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            background:linear-gradient(135deg,#667eea,#764ba2);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .container{
            background:white;
            width:450px;
            padding:40px;
            border-radius:20px;
            text-align:center;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
        }

        h1{
            color:#333;
            margin-bottom:20px;
        }

        h2{
            color:#4f46e5;
            margin-bottom:20px;
        }

        .attendance-box{
            background:#f4f7ff;
            padding:20px;
            border-radius:15px;
            margin:20px 0;
        }

        .attendance-value{
            font-size:40px;
            font-weight:bold;
            color:#10b981;
        }

        .warning{
            background:#ffe5e5;
            color:#d63031;
            padding:15px;
            border-radius:10px;
            font-weight:bold;
            margin-top:15px;
        }

        .success{
            background:#e7fff0;
            color:#00b894;
            padding:15px;
            border-radius:10px;
            font-weight:bold;
            margin-top:15px;
        }

        .btn{
            display:inline-block;
            margin-top:25px;
            padding:12px 25px;
            background:#4f46e5;
            color:white;
            text-decoration:none;
            border-radius:10px;
            font-weight:bold;
            transition:0.3s;
        }

        .btn:hover{
            background:#3730a3;
            transform:translateY(-2px);
        }

    </style>
</head>

<body>

<div class="container">

    <h1>📊 Attendance Details</h1>

    <h2>{{ name }}</h2>

    <div class="attendance-box">
        <p>Your Attendance</p>
        <div class="attendance-value">
            {{ attendance }}%
        </div>
    </div>

    {% if attendance < 75 %}
        <div class="warning">
            ⚠ Warning: Attendance below 75%
        </div>
    {% else %}
        <div class="success">
            ✅ Attendance Requirement Satisfied
        </div>
    {% endif %}

    <a href="/dashboard" class="btn">
        ⬅ Back to Dashboard
    </a>

</div>

</body>
</html>
