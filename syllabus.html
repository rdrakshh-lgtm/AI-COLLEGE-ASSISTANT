<!DOCTYPE html>
<html>
<head>
    <title>Syllabus PDFs</title>
</head>
<body>

<h2>Uploaded PDFs</h2>

{% if files %}

<ul>
{% for file in files %}
    <li>
        <a href="/uploads/{{ file }}" target="_blank">
            {{ file }}
        </a>
    </li>
{% endfor %}
</ul>

{% else %}

<p>No PDFs uploaded.</p>

{% endif %}

<a href="/dashboard">Back to Dashboard</a>

</body>
</html>
