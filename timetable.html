<!DOCTYPE html>
<html>
<head>
    <title>Timetable</title>
</head>
<body>

<h2>Class Timetable</h2>

<table border="1" cellpadding="10">

    <tr>
        <th>Day</th>
        <th>Subject</th>
        <th>Timing</th>
    </tr>

    {% for row in timetable %}

    <tr>
        <td>{{ row[1] }}</td>
        <td>{{ row[2] }}</td>
        <td>{{ row[3] }}</td>
    </tr>

    {% endfor %}

</table>

</body>
</html>
