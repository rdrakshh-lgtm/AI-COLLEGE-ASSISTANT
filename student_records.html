<center>
    <h2 id="predictionResult"></h2>
</center>

<script>
function predictPlacement() {

    var form = document.querySelector("form");
    var formData = new FormData(form);

    fetch("/predict_placement", {
        method: "POST",
        body: formData
    })
    .then(response => response.json())
    .then(data => {

        alert("Prediction = " + data.result);

        let box = document.getElementById("predictionResult");

        console.log(box);

        if(box == null){
            alert("predictionResult not found");
            return;
        }

        box.innerHTML = "Placement Prediction : <b>" + data.result + "</b>";
        box.style.color = "green";
        box.style.display = "block";

    })
    .catch(error=>{
        console.log(error);
    });

}
</script>
