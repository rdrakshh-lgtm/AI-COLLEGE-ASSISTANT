<!DOCTYPE html>
<html>
<head>
    <title>Placements</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Segoe UI, sans-serif;
        }

        body{
            background:#f4f7fc;
            padding:30px;
        }

        h1{
            color:#2c3e50;
            margin-bottom:25px;
        }

        /* Statistics Cards */

        .stats-container{
            display:flex;
            gap:20px;
            margin-bottom:30px;
            flex-wrap:wrap;
        }

        .stat-card{
            flex:1;
            min-width:220px;
            padding:25px;
            border-radius:15px;
            color:white;
            text-align:center;
            box-shadow:0 5px 15px rgba(0,0,0,0.15);
            transition:0.3s;
        }

        .stat-card:hover{
            transform:translateY(-5px);
        }

        .companies{
            background:linear-gradient(135deg,#667eea,#764ba2);
        }

        .highest{
            background:linear-gradient(135deg,#11998e,#38ef7d);
        }

        .average{
            background:linear-gradient(135deg,#f7971e,#ffd200);
        }

        .stat-card h2{
            font-size:32px;
            margin-bottom:10px;
        }

        .stat-card p{
            font-size:18px;
        }

        /* Table Section */

        .table-container{
            background:white;
            border-radius:15px;
            padding:20px;
            box-shadow:0 4px 15px rgba(0,0,0,0.1);
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        th{
            background:#4f46e5;
            color:white;
            padding:15px;
        }

        td{
            padding:15px;
            border-bottom:1px solid #eee;
            text-align:center;
        }

        tr:hover{
            background:#f8f9ff;
        }

        .apply-btn{
            background:#10b981;
            color:white;
            padding:8px 16px;
            border-radius:8px;
            text-decoration:none;
            font-weight:bold;
        }

        .apply-btn:hover{
            background:#059669;
        }

    </style>
</head>
<body>

<h1>💼 Placement Opportunities</h1>

<div class="stats-container">

    <div class="stat-card companies">
        <h2>{{ total_companies }}</h2>
        <p>Total Companies</p>
    </div>

    <div class="stat-card highest">
        <h2>18 LPA</h2>
        <p>Highest Package</p>
    </div>

    <div class="stat-card average">
        <h2>6.5 LPA</h2>
        <p>Average Package</p>
    </div>

</div>

<div class="table-container">

<table>

<tr>
    <th>Company</th>
    <th>Role</th>
    <th>Package</th>
    <th>Eligibility</th>
    <th>Drive Date</th>
    <th>Apply</th>
</tr>

{% for p in placements %}

<tr>
    <td>{{ p[1] }}</td>
    <td>{{ p[2] }}</td>
    <td>{{ p[3] }}</td>
    <td>{{ p[4] }}</td>
    <td>{{ p[5] }}</td>
    <td>
        <a href="{{ p[6] }}" target="_blank" class="apply-btn">
            Apply Now
        </a>
    </td>
</tr>

{% endfor %}

</table>

</div>

</body>
</html>
